name = "discount-liquor"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Morning summary & alerts to Telegram: 13:45 UTC = 9:45 AM EDT / 8:45 AM EST
[triggers]
crons = ["45 13 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "discount-liquor"
database_id = "PASTE_DATABASE_ID_HERE"

# Invoice PDFs/photos and product images stored in Cloudflare R2
[[r2_buckets]]
binding = "FILES"
bucket_name = "discount-liquor-files"

# Built React PWA static assets served by Cloudflare Worker
[assets]
directory = "./qilbo-app/dist"
binding = "ASSETS"

[vars]
GEMINI_MODEL = "gemini-2.5-flash"
PUBLIC_URL = ""

# Secrets to set via `npx wrangler secret put NAME` (never commit):
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_WEBHOOK_SECRET
# - OWNER_CHAT_ID
# - GEMINI_API_KEY
# - DASHBOARD_PASSWORD
# - INGEST_KEY
